[package]
name = "example-adapter"
version = "0.1.0"
description = "Template for a heimr adapter: polls a sensor's HTTP JSON endpoint."
edition = "2024"
# The minimum Rust version heimr supports (its workspace rust-version).
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

# A standalone crate: copy this directory out of the heimr tree to start an
# adapter. In the tree, heimr's own tests compile and run it so it cannot
# rot. After copying, replace the three path dependencies with git ones:
#   heimr-core = { git = "https://github.com/hugsmid/heimr" }
#   heimr-testkit = { git = "https://github.com/hugsmid/heimr" }
#   heimr = { git = "https://github.com/hugsmid/heimr" }   # only if you use it
[workspace]

[dependencies]
heimr-core = { path = "../../crates/heimr-core" }
jiff = { version = "0.2.43", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["macros", "time"] }

[dev-dependencies]
heimr-testkit = { path = "../../crates/heimr-testkit" }
tokio = { version = "1.54", features = ["macros", "rt", "time"] }
