# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained (no fix available). Dev-only: pulled in by testcontainers for
  # copying files into containers, which our tests don't use. Revisit when
  # testcontainers moves off it.
  { id = "RUSTSEC-2026-0440", reason = "dev-only via testcontainers; unused code path" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Prefer rustls everywhere; keep OpenSSL out of the graph.
  { crate = "openssl-sys", use-instead = "rustls" },
  { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
