[package]
name = "heimr-core"
version = "0.1.0"
description = "Domain types, the adapter contract and the command safety layer (setpoint bands, holds, rate limits, a durable audit trail, shadow mode) for heimr."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["home-automation", "smart-home", "adapter", "heating"]
categories = ["asynchronous"]

[lints]
workspace = true

[dependencies]
jiff.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "test-util"] }
