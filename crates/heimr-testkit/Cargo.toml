[package]
name = "heimr-testkit"
version = "0.1.0"
description = "Test kit for heimr adapters: a conformance suite of named scenarios, a direct-drive harness, record/replay with redaction, and stable rendering for snapshots."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["home-automation", "testing", "conformance", "adapter"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[features]
default = ["replay"]
# Record/replay of HTTP upstreams on a local mock server.
replay = ["dep:wiremock"]

[dependencies]
heimr.workspace = true
heimr-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
toml.workspace = true
wiremock = { workspace = true, optional = true }

[dev-dependencies]
reqwest.workspace = true
proptest.workspace = true
