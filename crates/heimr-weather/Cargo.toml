[package]
name = "heimr-weather"
version = "0.1.0"
description = "A read-only heimr adapter for Open-Meteo: hourly weather forecasts as forecasts, and recent hours as estimated readings."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["home-automation", "weather", "open-meteo", "forecast", "adapter"]
categories = ["api-bindings"]

[lints]
workspace = true

[dependencies]
heimr-core.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tracing.workspace = true
url.workspace = true
weather.workspace = true

[dev-dependencies]
heimr.workspace = true
heimr-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util"] }
