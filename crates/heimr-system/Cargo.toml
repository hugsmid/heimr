[package]
name = "heimr-system"
version = "0.1.0"
description = "A read-only heimr adapter recording the host's own health: CPU, load, memory, disks, network, temperatures, selected processes and services, and the hub process."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["home-automation", "monitoring", "procfs", "metrics", "adapter"]
categories = ["os::linux-apis"]

[lints]
workspace = true

[dependencies]
heimr-core.workspace = true
jiff.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
criterion.workspace = true
heimr-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "test-util"] }

[[bench]]
name = "sample"
harness = false
